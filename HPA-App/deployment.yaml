apiVersion: apps/v1
kind: Deployment

metadata:
  name: hpa-app-deployment

spec:
  replicas: 1

  selector:
    matchLabels:
      app: hpa-app

  template:
    metadata:
      labels:
        app: hpa-app

    spec:
      containers:
      - name: hpa-app-container
        image: nginx:latest

        ports:
        - containerPort: 80

        resources:
          requests:
            cpu: 100m
            memory: 128Mi

          limits:
            cpu: 200m
            memory: 256Mi

        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10

        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 15
          periodSeconds: 20